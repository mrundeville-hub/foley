[project]
name = "foley"
version = "0.4.0"
description = "Weirdo procedural sound design for local videos and GIFs, with an animated blue terminal score"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy>=1.13", "pedalboard", "textual>=8"]

[project.scripts]
foley = "foley:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["foley", "foley_engine", "foley_tui", "foley_preview"]
